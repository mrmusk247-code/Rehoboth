<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061230">
<title>Rehoboth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: blue brand bar on top, one narrow column, floating glass tab bar, cards for jobs. Palette: all blue, one look in light and dark. */
:root{
  --bg:#061230; --card:#0d1f45; --ink:#eef4ff; --mute:#8fa8d8; --line:#1c3670;
  --brand:#0a1c46; --brand-ink:#ffffff;
  --accent:#2f6bff; --accent2:#22b4ff; --accent-ink:#ffffff; --ok:#35d08a; --bad:#ff7070;
  --grad:linear-gradient(135deg,#2f6bff,#22b4ff);
  --display:"Sora",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:16px}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}
h2{font-size:21px;font-weight:600;margin-bottom:12px}
.sub{color:var(--mute);margin:4px 0 20px}
.brand{background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:16px 18px;margin-bottom:20px;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--accent2)}
.brand b{font:800 26px var(--display);letter-spacing:-.01em}
.brand span{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 4px}
input,select,textarea,button{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer}
.btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:var(--grad);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;margin:0;padding:9px 14px;white-space:nowrap}
.btn[disabled]{opacity:.6}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;padding:10px;border:0;background:transparent;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--grad);color:var(--accent-ink)}
.msg{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:14px}
.msg.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.job{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.job h3{margin:0 0 4px;font:600 17px var(--display)}
.meta{color:var(--mute);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.tag{border:1px solid var(--line);background:color-mix(in srgb,var(--accent) 20%,transparent);border-radius:99px;padding:1px 9px;font-size:12px}
.price{font:800 20px var(--display);font-variant-numeric:tabular-nums;margin:8px 0}
.offerbox{display:flex;gap:8px;margin-top:10px}
.offerbox input{min-width:0}
.row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row2 .btn{flex:1;min-width:110px}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.note p{margin:0 0 4px}
.empty{color:var(--mute);text-align:center;padding:32px 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--mute)}
.pill{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.no{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--ink)}
nav{position:fixed;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),410px);
  bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;
  display:flex;padding:6px;border-radius:999px;
  background:color-mix(in srgb,var(--card) 58%,transparent);
  -webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);
  border:1px solid color-mix(in srgb,#fff 16%,transparent);
  box-shadow:0 12px 32px rgba(0,0,0,.45),inset 0 1px 0 color-mix(in srgb,#fff 22%,transparent)}
nav .dot{position:absolute;top:6px;left:6px;width:calc((100% - 12px)/5);height:calc(100% - 12px);
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  transition:transform .5s cubic-bezier(.3,1.35,.45,1),opacity .2s}
nav .dot i{display:block;width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.55),transparent 52%),var(--grad);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 6px 20px rgba(47,107,255,.65),inset 0 -3px 6px rgba(0,30,120,.35)}
nav button{position:relative;flex:1;height:52px;border:0;background:none;border-radius:999px;color:var(--mute);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:color .25s}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent-ink)}
nav button:active svg{transform:scale(.88)}
nav button svg{transition:transform .2s}
.badge{position:absolute;top:9px;right:calc(50% - 17px);width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
nav button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;width:58px;height:58px;border-radius:50%;border:0;
  background:var(--grad);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(47,107,255,.6);transition:transform .2s}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
@media (prefers-reduced-motion:reduce){nav .dot,nav button,.fab{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><b>Rehoboth</b><span>Middle Man</span></header>
  <section id="auth" hidden>
    <h2>Welcome</h2>
    <p class="sub">Find work. Hire help. Buy and sell near you.</p>
    <div class="seg" role="tablist">
      <button id="tabUp" class="on" type="button">Sign up</button>
      <button id="tabIn" type="button">Log in</button>
    </div>
    <form id="authForm" novalidate>
      <div id="upFields">
        <label for="name">Full name</label>
        <input id="name" autocomplete="name">
        <label for="role">I want to</label>
        <select id="role">
          <option value="worker">Find work</option>
          <option value="hirer">Hire someone</option>
          <option value="both">Both</option>
        </select>
        <label for="job">What do you do for a living?</label>
        <input id="job" placeholder="Electrician, driver, tailor, nurse, teacher" autocomplete="organization-title">
        <label for="country">Country</label>
        <select id="country"><option value="">Select your country</option></select>
        <div class="row">
          <div><label for="city">City</label><input id="city" placeholder="Accra" autocomplete="address-level2"></div>
          <div><label for="area">Area</label><input id="area" placeholder="Osu"></div>
        </div>
      </div>
      <div id="phoneBox">
        <label for="phone">Phone number with country code</label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+233 24 123 4567">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email">
      <label for="pw">Password (6+ characters)</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button id="authBtn" class="btn" type="submit">Create account</button>
    </form>
    <div id="authMsg" role="status"></div>
  </section>

  <section id="app" hidden>
    <div id="vJobs">
      <h2>Jobs near you</h2>
      <label for="fQ">Search</label>
      <input id="fQ" type="search" placeholder="Plumber, driver, tailor, cleaning">
      <div class="row">
        <div><label for="fCity">City</label><input id="fCity"></div>
        <div><label for="fArea">Area</label><input id="fArea"></div>
        <div><label for="fTerm">Type</label>
          <select id="fTerm"><option value="">All</option><option value="short">Short-term</option><option value="long">Long-term</option></select></div>
      </div>
      <p class="sub" style="margin:10px 0 14px">Short-term jobs show for your area. Long-term jobs show citywide.</p>
      <div id="jobList"></div>
      <div id="jobMsg" role="status"></div>
    </div>

    <div id="vMine" hidden>
      <h2>My jobs</h2>
      <div id="mineList"></div>
      <div id="mineMsg" role="status"></div>
    </div>

    <div id="vNotes" hidden>
      <h2>Alerts</h2>
      <div id="noteList"></div>
      <div id="noteMsg" role="status"></div>
    </div>

    <div id="vPost" hidden>
      <h2>Post a job</h2>
      <form id="postForm" novalidate>
        <label for="pTitle">What do you need done?</label>
        <input id="pTitle" placeholder="Paint two rooms">
        <div class="row">
          <div><label for="pCat">Type of work</label>
            <input id="pCat" list="cats" placeholder="Pick or type your own" autocomplete="off">
            <datalist id="cats">
              <option>Cleaning</option><option>Plumbing</option><option>Electrical</option><option>Carpentry</option><option>Painting</option>
              <option>Repairs and maintenance</option><option>Construction</option><option>Moving and delivery</option><option>Driving</option>
              <option>Car services</option><option>Farming</option><option>Cooking and catering</option><option>Tailoring and fashion</option>
              <option>Beauty and hair</option><option>Teaching and tutoring</option><option>Healthcare and caregiving</option><option>Security</option>
              <option>IT and software</option><option>Design and media</option><option>Office and admin</option><option>Sales and marketing</option>
              <option>Accounting</option><option>Legal</option><option>Events and entertainment</option><option>Other</option>
            </datalist></div>
          <div><label for="pTerm">Type</label>
            <select id="pTerm"><option value="short">Short-term</option><option value="long">Long-term</option></select></div>
        </div>
        <div class="row">
          <div><label for="pCity">City</label><input id="pCity"></div>
          <div><label for="pArea">Area (short-term)</label><input id="pArea"></div>
        </div>
        <label for="pBudget">Budget</label>
        <input id="pBudget" type="number" min="0" inputmode="decimal">
        <label for="pDesc">Details</label>
        <textarea id="pDesc" rows="3"></textarea>
        <button class="btn" type="submit">Publish job</button>
      </form>
      <div id="postMsg" role="status"></div>
    </div>

    <div id="vMe" hidden>
      <h2>My profile</h2>
      <div id="meBox"></div>
      <button id="logout" class="btn ghost" type="button">Log out</button>
    </div>
  </section>
</div>

<button id="fab" class="fab" type="button" aria-label="Post a job" hidden>
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>
<nav id="nav" hidden aria-label="Main">
  <div class="dot" id="dot"><i></i></div>
  <button data-v="vJobs" data-i="0" class="on" type="button" aria-label="Home">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/></svg><span>Home</span></button>
  <button data-v="search" data-i="1" type="button" aria-label="Search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search</span></button>
  <button data-v="vMine" data-i="2" type="button" aria-label="My jobs">
    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span>My jobs</span></button>
  <button data-v="vNotes" data-i="3" type="button" aria-label="Alerts">
    <svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg><i class="badge" id="badge" hidden></i><span>Alerts</span></button>
  <button data-v="vMe" data-i="4" type="button" aria-label="Profile">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Profile</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Public project values. The publishable key is designed to be in the page; the database rules protect the data.
var SUPABASE_URL = "https://fqxpbbuqmfrmdcctqoek.supabase.co";
var SUPABASE_KEY = "sb_publishable_pNNTxuFPBUE_HzAwbNoL9A_rHeEvP3F";

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var $ = function (id) { return document.getElementById(id); };
var mode = "up", me = null, profile = null, phone = "", shownFor = null;
var COUNTRIES = "Afghanistan|Albania|Algeria|Angola|Argentina|Armenia|Australia|Austria|Azerbaijan|Bahamas|Bahrain|Bangladesh|Belarus|Belgium|Belize|Benin|Bolivia|Bosnia and Herzegovina|Botswana|Brazil|Bulgaria|Burkina Faso|Burundi|Cambodia|Cameroon|Canada|Cape Verde|Central African Republic|Chad|Chile|China|Colombia|Comoros|Congo|Costa Rica|Cote d'Ivoire|Croatia|Cuba|Cyprus|Czechia|Democratic Republic of the Congo|Denmark|Djibouti|Dominican Republic|Ecuador|Egypt|El Salvador|Equatorial Guinea|Eritrea|Estonia|Eswatini|Ethiopia|Fiji|Finland|France|Gabon|Gambia|Georgia|Germany|Ghana|Greece|Guatemala|Guinea|Guinea-Bissau|Guyana|Haiti|Honduras|Hungary|Iceland|India|Indonesia|Iran|Iraq|Ireland|Israel|Italy|Jamaica|Japan|Jordan|Kazakhstan|Kenya|Kuwait|Kyrgyzstan|Laos|Latvia|Lebanon|Lesotho|Liberia|Libya|Lithuania|Luxembourg|Madagascar|Malawi|Malaysia|Mali|Malta|Mauritania|Mauritius|Mexico|Moldova|Mongolia|Morocco|Mozambique|Myanmar|Namibia|Nepal|Netherlands|New Zealand|Nicaragua|Niger|Nigeria|North Macedonia|Norway|Oman|Pakistan|Palestine|Panama|Papua New Guinea|Paraguay|Peru|Philippines|Poland|Portugal|Qatar|Romania|Russia|Rwanda|Saudi Arabia|Senegal|Serbia|Sierra Leone|Singapore|Slovakia|Slovenia|Somalia|South Africa|South Korea|South Sudan|Spain|Sri Lanka|Sudan|Suriname|Sweden|Switzerland|Syria|Taiwan|Tajikistan|Tanzania|Thailand|Togo|Trinidad and Tobago|Tunisia|Turkey|Turkmenistan|Uganda|Ukraine|United Arab Emirates|United Kingdom|United States|Uruguay|Uzbekistan|Venezuela|Vietnam|Yemen|Zambia|Zimbabwe".split("|");
$("country").innerHTML += COUNTRIES.map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("");

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function say(el, text, kind) {
  el.innerHTML = text ? '<div class="msg ' + kind + '">' + esc(text) + "</div>" : "";
}
function nice(err) {
  var m = (err && err.message) || "Something went wrong. Try again.";
  if (/Invalid login/i.test(m)) return "Wrong email or password.";
  if (/already registered/i.test(m)) return "That email already has an account. Log in instead.";
  if (/Offer limit/i.test(m)) return "Offer limit reached. Verify your ID to send more offers.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "No connection. Check your data and try again.";
  return m;
}

/* Auth screen */
function setMode(m) {
  mode = m;
  $("tabUp").classList.toggle("on", m === "up");
  $("tabIn").classList.toggle("on", m === "in");
  $("upFields").hidden = m !== "up"; $("phoneBox").hidden = m !== "up";
  $("authBtn").textContent = m === "up" ? "Create account" : "Log in";
  $("pw").autocomplete = m === "up" ? "new-password" : "current-password";
  say($("authMsg"), "");
}
$("tabUp").onclick = function () { setMode("up"); };
$("tabIn").onclick = function () { setMode("in"); };

$("authForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  var email = $("email").value.trim(), pw = $("pw").value;
  if (!email || pw.length < 6) return say($("authMsg"), "Enter your email and a password of 6 or more characters.", "err");
  var btn = $("authBtn"); btn.disabled = true;
  try {
    if (mode === "up") {
      var name = $("name").value.trim(), city = $("city").value.trim(), phone = $("phone").value.trim(), country = $("country").value, job = $("job").value.trim();
      if (!name || !city || !country) { btn.disabled = false; return say($("authMsg"), "Enter your name, country and city.", "err"); }
      if ($("role").value !== "hirer" && !job) { btn.disabled = false; return say($("authMsg"), "Write what you do for a living, so people who need you can find you.", "err"); }
      phone = phone.replace(/[\s().-]/g, "");
      if (!/^\+[1-9][0-9]{7,14}$/.test(phone)) { btn.disabled = false; return say($("authMsg"), "Start your number with the country code, for example +233 24 123 4567 or +1 415 555 0123.", "err"); }
      var r = await sb.auth.signUp({ email: email, password: pw, options: { data: {
        name: name, role: $("role").value, city: city, area: $("area").value.trim(), phone: phone, country: country, occupation: job } } });
      if (r.error) throw r.error;
      if (!r.data.session) say($("authMsg"), "Account created. Open the email we sent you, tap the confirm link, then log in.", "ok");
    } else {
      var r2 = await sb.auth.signInWithPassword({ email: email, password: pw });
      if (r2.error) throw r2.error;
    }
  } catch (err) { say($("authMsg"), nice(err), "err"); }
  btn.disabled = false;
});

/* Session */
sb.auth.onAuthStateChange(function (_e, session) { me = session ? session.user : null; route(); });
(async function () {
  var r = await sb.auth.getSession();
  me = r.data.session ? r.data.session.user : null;
  route();
})();

async function route() {
  $("auth").hidden = !!me;
  $("app").hidden = !me;
  $("nav").hidden = !me;
  if (!me) { $("fab").hidden = true; shownFor = null; return; }
  var r = await sb.from("profiles").select("*").eq("id", me.id).maybeSingle();
  profile = r.data;
  var c = await sb.from("contacts").select("phone").eq("id", me.id).maybeSingle();
  phone = c.data ? c.data.phone : "";
  if (profile) {
    if (!$("fCity").value) $("fCity").value = profile.city || "";
    if (!$("fArea").value) $("fArea").value = profile.area || "";
    if (!$("pCity").value) $("pCity").value = profile.city || "";
    if (!$("pArea").value) $("pArea").value = profile.area || "";
  }
  loadNotes();
  if (shownFor !== me.id) { shownFor = me.id; show("vJobs", 0); } else { loadJobs(); renderMe(); }
}

/* Tabs: the gold circle slides under the active icon */
var VIEWS = ["vJobs", "vPost", "vMine", "vNotes", "vMe"], prevIdx = null;
function show(view, idx) {
  VIEWS.forEach(function (v) { $(v).hidden = v !== view; });
  var btns = document.querySelectorAll("#nav button");
  btns.forEach(function (b) { b.classList.toggle("on", idx != null && Number(b.dataset.i) === idx); });
  var dot = $("dot");
  dot.style.opacity = idx == null ? 0 : 1;
  if (idx != null) {
    dot.style.transform = "translateX(" + (idx * 100) + "%)";
    var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (prevIdx != null && prevIdx !== idx && !calm && dot.firstElementChild.animate) {
      var far = Math.abs(idx - prevIdx);
      dot.firstElementChild.animate(
        [{ transform: "scale(1,1)" }, { transform: "scale(" + (1.5 + 0.35 * far) + ",.88)", offset: 0.4 }, { transform: "scale(1.06,.97)", offset: 0.75 }, { transform: "scale(1,1)" }],
        { duration: 560, easing: "ease-in-out" });
    }
    prevIdx = idx;
  }
  $("fab").hidden = !me || (view !== "vJobs" && view !== "vMine");
  window.scrollTo(0, 0);
  if (view === "vJobs") loadJobs();
  if (view === "vMe") renderMe();
  if (view === "vMine") loadMine();
  if (view === "vNotes") loadNotes();
}
document.querySelectorAll("#nav button").forEach(function (b) {
  b.onclick = function () {
    if (b.dataset.v === "search") { show("vJobs", 1); $("fQ").focus(); return; }
    show(b.dataset.v, Number(b.dataset.i));
  };
});
$("fab").onclick = function () { show("vPost", null); };

/* Jobs */
["fCity", "fArea", "fTerm"].forEach(function (id) { $(id).addEventListener("change", loadJobs); });
var qTimer = null;
$("fQ").addEventListener("input", function () { clearTimeout(qTimer); qTimer = setTimeout(loadJobs, 350); });

async function loadJobs() {
  var city = $("fCity").value.trim(), area = $("fArea").value.trim().toLowerCase(), term = $("fTerm").value;
  var q = sb.from("jobs").select("*").eq("status", "open").eq("country", (profile && profile.country) || "").order("created_at", { ascending: false }).limit(60);
  if (city) q = q.ilike("city", city);
  if (term) q = q.eq("term", term);
  var kw = $("fQ").value.trim().replace(/[%,()]/g, " ");
  if (kw) q = q.or("title.ilike.%" + kw + "%,category.ilike.%" + kw + "%");
  var r = await q;
  if (r.error) { $("jobList").innerHTML = ""; return say($("jobMsg"), nice(r.error), "err"); }
  say($("jobMsg"), "");
  var rows = (r.data || []).filter(function (j) {
    return j.term === "long" || !area || (j.area || "").toLowerCase() === area;
  });
  if (!rows.length) {
    $("jobList").innerHTML = '<div class="empty">No jobs here yet. Post the first one from the Post tab.</div>';
    return;
  }
  $("jobList").innerHTML = rows.map(function (j) {
    var mine = me && j.poster_id === me.id;
    return '<article class="job"><h3>' + esc(j.title) + '</h3>' +
      '<div class="meta"><span class="tag">' + esc(j.category) + '</span><span class="tag">' +
      (j.term === "short" ? "Short-term" : "Long-term") + '</span><span>' + esc(j.city) +
      (j.term === "short" && j.area ? " · " + esc(j.area) : "") + '</span></div>' +
      (j.description ? '<p style="margin:8px 0 0">' + esc(j.description) + '</p>' : "") +
      '<div class="price">' + Number(j.budget).toLocaleString() + '</div>' +
      (mine ? '<div class="meta">Your job</div>' :
        '<div class="offerbox"><input type="number" min="0" inputmode="decimal" placeholder="Your offer" aria-label="Your offer" id="o' + j.id + '">' +
        '<button class="btn small" type="button" data-job="' + j.id + '">Send offer</button></div>') +
      '</article>';
  }).join("");
  document.querySelectorAll("[data-job]").forEach(function (b) {
    b.onclick = function () { sendOffer(Number(b.dataset.job), b); };
  });
}

async function sendOffer(jobId, btn) {
  var amount = Number($("o" + jobId).value);
  if (!(amount > 0)) return say($("jobMsg"), "Enter your offer amount first.", "err");
  btn.disabled = true;
  var r = await sb.from("offers").insert({ job_id: jobId, amount: amount });
  btn.disabled = false;
  if (r.error) {
    if (r.error.code === "23505") return say($("jobMsg"), "You already sent an offer on this job.", "err");
    return say($("jobMsg"), nice(r.error), "err");
  }
  say($("jobMsg"), "Offer sent.", "ok");
  $("o" + jobId).value = "";
}

/* My jobs */
async function loadMine() {
  var r = await sb.from("jobs").select("*").eq("poster_id", me.id).order("created_at", { ascending: false }).limit(50);
  if (r.error) { $("mineList").innerHTML = ""; return say($("mineMsg"), nice(r.error), "err"); }
  say($("mineMsg"), "");
  var rows = r.data || [];
  if (!rows.length) { $("mineList").innerHTML = '<div class="empty">You have not posted a job yet. Tap the + button to post one.</div>'; return; }
  var labels = { open: "Open", in_progress: "In progress", done: "Done", cancelled: "Cancelled" };
  $("mineList").innerHTML = rows.map(function (j) {
    var live = j.status === "open" || j.status === "in_progress";
    return '<article class="job"><h3>' + esc(j.title) + '</h3><div class="meta"><span class="tag">' + esc(j.category) +
      '</span><span class="tag">' + (j.term === "short" ? "Short-term" : "Long-term") + '</span><span>' + esc(j.city) +
      '</span><span class="pill ' + (j.status === "done" ? "ok" : "no") + '">' + esc(labels[j.status] || j.status) + '</span></div>' +
      '<div class="price">' + Number(j.budget).toLocaleString() + '</div>' +
      (live ? '<div class="row2"><button class="btn small ghost" type="button" data-job="' + j.id + '" data-set="done">Mark done</button>' +
        '<button class="btn small ghost" type="button" data-job="' + j.id + '" data-set="cancelled">Cancel job</button></div>' : "") + '</article>';
  }).join("");
  document.querySelectorAll("#mineList [data-set]").forEach(function (b) {
    b.onclick = async function () {
      b.disabled = true;
      var u = await sb.from("jobs").update({ status: b.dataset.set }).eq("id", Number(b.dataset.job));
      if (u.error) { b.disabled = false; return say($("mineMsg"), nice(u.error), "err"); }
      loadMine();
    };
  });
}

/* Alerts: offers you sent and offers on your jobs */
async function loadNotes() {
  var r = await sb.from("offers").select("*, jobs(title, poster_id), profiles(name, occupation)").order("created_at", { ascending: false }).limit(40);
  if (r.error) { $("noteList").innerHTML = ""; return say($("noteMsg"), nice(r.error), "err"); }
  say($("noteMsg"), "");
  var rows = r.data || [];
  var pending = rows.filter(function (o) { return o.worker_id !== me.id && o.status === "pending"; }).length;
  $("badge").hidden = pending === 0;
  if (!rows.length) { $("noteList").innerHTML = '<div class="empty">No alerts yet. Offers you send and offers on your jobs show up here.</div>'; return; }
  var names = { pending: "Waiting", accepted: "Accepted", rejected: "Declined" };
  $("noteList").innerHTML = rows.map(function (o) {
    var title = o.jobs ? o.jobs.title : "a job";
    var mine = o.worker_id === me.id;
    var head = mine ? "You offered " + Number(o.amount).toLocaleString() + " on " : "New offer of " + Number(o.amount).toLocaleString() + " on ";
    return '<div class="note"><p><b>' + esc(head) + esc(title) + '</b></p>' +
      (!mine && o.profiles ? '<p class="meta">' + esc(o.profiles.name || "Someone") + (o.profiles.occupation ? " · " + esc(o.profiles.occupation) : "") + '</p>' : "") +
      (o.message ? '<p>' + esc(o.message) + '</p>' : "") +
      '<div class="meta"><span class="pill ' + (o.status === "accepted" ? "ok" : "no") + '">' + esc(names[o.status] || o.status) + '</span></div>' +
      (!mine && o.status === "pending" ? '<div class="row2"><button class="btn small" type="button" data-offer="' + o.id + '" data-job="' + o.job_id + '" data-to="accepted">Accept</button>' +
        '<button class="btn small ghost" type="button" data-offer="' + o.id + '" data-job="' + o.job_id + '" data-to="rejected">Decline</button></div>' : "") + '</div>';
  }).join("");
  document.querySelectorAll("#noteList [data-offer]").forEach(function (b) {
    b.onclick = async function () {
      b.disabled = true;
      var u = await sb.from("offers").update({ status: b.dataset.to }).eq("id", Number(b.dataset.offer));
      if (u.error) { b.disabled = false; return say($("noteMsg"), nice(u.error), "err"); }
      if (b.dataset.to === "accepted") await sb.from("jobs").update({ status: "in_progress" }).eq("id", Number(b.dataset.job));
      loadNotes();
    };
  });
}

/* Post */
$("postForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  var title = $("pTitle").value.trim(), city = $("pCity").value.trim(), budget = Number($("pBudget").value);
  var cat = $("pCat").value.trim();
  if (!title || !cat || !city || !(budget >= 0) || $("pBudget").value === "")
    return say($("postMsg"), "Add a title, type of work, city and budget.", "err");
  var r = await sb.from("jobs").insert({
    title: title, category: cat, term: $("pTerm").value, city: city, country: (profile && profile.country) || "",
    area: $("pArea").value.trim() || null, budget: budget, description: $("pDesc").value.trim() || null });
  if (r.error) return say($("postMsg"), nice(r.error), "err");
  say($("postMsg"), "Job published. Tap Jobs to see it.", "ok");
  $("pTitle").value = ""; $("pCat").value = ""; $("pBudget").value = ""; $("pDesc").value = "";
});

/* Profile */
function renderMe() {
  if (!me) return;
  var p = profile || {};
  var roles = { worker: "Looking for work", hirer: "Hiring", both: "Work and hiring" };
  $("meBox").innerHTML =
    '<div class="kv"><span>Name</span><span>' + esc(p.name || "") + '</span></div>' +
    '<div class="kv"><span>Email</span><span>' + esc(me.email) + '</span></div>' +
    '<div class="kv"><span>Phone</span><span>' + esc(phone || "Not added") + '</span></div>' +
    '<div class="kv"><span>Work</span><span>' + esc(p.occupation || "Not added") + '</span></div>' +
    '<div class="kv"><span>Role</span><span>' + esc(roles[p.role] || "") + '</span></div>' +
    '<div class="kv"><span>Location</span><span>' + esc([p.area, p.city, p.country].filter(Boolean).join(", ")) + '</span></div>' +
    '<div class="kv"><span>Rating</span><span>' + Number(p.rating || 0).toFixed(1) + ' · ' + (p.jobs_done || 0) + ' jobs done</span></div>' +
    '<div class="kv"><span>ID verification</span><span class="pill ' + (p.verified ? "ok" : "no") + '">' +
    (p.verified ? "Verified" : "Not verified · 2 offers max") + '</span></div>';
}
$("logout").onclick = async function () { await sb.auth.signOut(); };

setMode("up");
</script>
</body>
</html>
